<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifare return operations</title><link rel="stylesheet" href="/return-operations.css"></head><body>
<main><h1>Rifare return operations</h1><p>Diagnostic records only. Receipt, inspection, money and shipment are separate stages.</p>
<form id="connect"><label>Session token <input id="token" type="password" autocomplete="off" required></label><label>Request ID <input id="request" required></label><label>Workflow <select id="workflow"><option value="return">Return</option><option value="exchange">Exchange</option></select></label><label>Approved skill digest <input id="skill" required pattern="[a-f0-9]{64}"></label><button>Open or resume</button></form>
<div class="actions"><button id="refresh" disabled>Refresh source status</button><button id="logout" disabled>Sign out</button></div><p id="message" role="status" aria-live="polite"></p>
<section id="state" hidden><h2>Observed stages</h2><dl id="summary"></dl><h2>Source records</h2><pre id="records"></pre>
<form id="quote"><label>Allocation <select id="allocation"></select></label><label>Replacement catalog ID (exchange only)<input id="catalog"></label><button id="quote-button">Request server quotation</button></form><pre id="quote-result"></pre><p>A quotation is not approval or completion. Use the established approval interface or API for the exact preview.</p>
<h2>Pinned skill guidance</h2><pre id="guidance"></pre></section></main><script src="/return-operations-client.js"></script></body></html>
