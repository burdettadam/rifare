<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifare · Execution preview</title><link rel="stylesheet" href="/configuration.css"><link rel="stylesheet" href="/accessibility.css"><script src="/accessibility-client.js" defer></script></head><body>
<a class="skip-link" href="#main-content">Skip to main content</a><main id="main-content" tabindex="-1"><header><p>RIFARE · LOCAL DIAGNOSTIC</p><h1>Review a case-plan change</h1><p>No payment, message, or commerce-platform mutation is available here.</p></header>
<form id="proposal"><label>Session token <input id="token" type="password" autocomplete="off" required></label><label>Case ID <input id="case" value="case_one" required></label>
<label>Resolution <select id="resolution"><option value="refund">Refund proposal</option><option value="exchange">Exchange proposal</option><option value="none">Clear proposal</option></select></label><button id="preview-button">Create preview</button></form>
<p id="notice" data-workflow-notice aria-atomic="true" tabindex="-1" role="status">Use a scoped operator session. A different authorized reviewer must approve the exact preview.</p>
<section id="review" hidden><h2 id="preview-heading" tabindex="-1">Server preview</h2><pre id="preview" aria-labelledby="preview-heading" tabindex="0"></pre><form id="approval" aria-describedby="preview notice"><label>Reviewer session <input id="reviewer" type="password" autocomplete="off" required></label><button>Approve this preview</button></form><button id="execute" type="button" aria-describedby="notice" disabled>Execute synthetic change once</button></section>
<button id="logout">Sign out and clear</button><pre id="result" aria-live="polite"></pre></main><script src="/execution-client.js" defer></script></body></html>
