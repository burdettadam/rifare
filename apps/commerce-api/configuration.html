<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifare · Configuration drafts</title><link rel="stylesheet" href="/configuration.css"><script defer src="/configuration-client.js"></script></head>
<body><main><header><p>RIFARE · MERCHANT CONFIGURATION</p><h1>Test a change before requesting review</h1><p>Drafts and simulations do not activate a policy or authorize a refund.</p></header>
<section><h2>Open a draft</h2><form id="connect"><label>Session token<input id="token" type="password" autocomplete="off" required></label><label>Draft ID<input id="draft" value="returns" pattern="[A-Za-z0-9_-]{1,96}" required></label><button type="submit">Open or start draft</button></form><button id="logout" type="button">Sign out</button></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="workspace" hidden><h2>Permitted settings</h2><form id="edit"><label>Return window (days)<input id="window" type="number" min="0" max="365" required></label><label class="check"><input id="evidence" type="checkbox"> Require evidence</label><label>Tone<select id="tone"><option>neutral</option><option>warm</option><option>formal</option></select></label><label>Locale<select id="locale"><option>en-US</option><option>en-GB</option><option>fr-CA</option></select></label><button type="submit">Save draft</button></form>
<div class="actions"><button id="undo" type="button">Restore starting settings</button><button id="simulate" type="button">Run boundary scenarios</button><button id="request" type="button" disabled>Request publication review</button></div>
<h2>Changes</h2><p id="change-summary" class="summary"></p><details open><summary>Technical diff and field provenance</summary><pre id="diff" tabindex="0" aria-label="Structured configuration changes"></pre></details><h2>Simulation results</h2><p id="scenario-summary" class="summary"></p><details open><summary>Raw scenario results</summary><pre id="results" tabindex="0" aria-label="Scenario outcomes"></pre></details><p id="identity"></p></section>
</main></body></html>
